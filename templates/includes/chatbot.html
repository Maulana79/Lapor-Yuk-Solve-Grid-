<div id="chatbot-wrapper" style="position: fixed !important; bottom: 34px !important; right: 24px !important; z-index: 999999 !important; display: flex !important;" class="flex-col items-end pointer-events-none md:bottom-6">
    
    <div id="chatbox-container" class="hidden w-[85vw] md:w-80 bg-white rounded-2xl shadow-2xl border border-gray-200 mb-4 overflow-hidden transition-all duration-300 pointer-events-auto">
        <div class="bg-emerald-600 px-4 py-3 flex justify-between items-center text-white">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
                <span class="font-bold text-sm">Asisten Lapor Yuk!</span>
            </div>
            <button onclick="toggleChat()" class="hover:text-gray-200 p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>
        
        <div id="chat-messages" class="p-4 h-60 md:h-64 overflow-y-auto bg-gray-50 flex flex-col gap-3 text-sm">
            <div class="bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 self-start max-w-[85%] shadow-sm">
                Halo! 👋 Ada yang bisa dibantu terkait pengaduan hari ini?
            </div>
        </div>
        
        <div class="p-3 bg-white border-t border-gray-100 flex gap-2">
            <input type="text" id="chat-input" placeholder="Ketik pertanyaan..." class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:border-emerald-500" onkeypress="handleEnter(event)">
            <button onclick="sendMessage()" class="bg-emerald-600 text-white p-2 rounded-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
            </button>
        </div>
    </div>

    <button onclick="toggleChat()" class="pointer-events-auto bg-emerald-600 text-white p-4 md:p-4 rounded-full shadow-2xl hover:bg-emerald-700 active:scale-90 transition transform shadow-emerald-500/40">
        <svg class="w-7 h-7 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
    </button>
</div>

<script>
    function toggleChat() {
        const chatbox = document.getElementById('chatbox-container');
        chatbox.classList.toggle('hidden');
    }

    function handleEnter(e) {
        if(e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('chat-input');
        const messageText = inputField.value.trim();
        if(!messageText) return;

        const chatMessages = document.getElementById('chat-messages');

        // User Message
        chatMessages.innerHTML += `
            <div class="bg-emerald-600 text-white rounded-lg rounded-tr-none p-3 self-end max-w-[80%] shadow-sm">
                ${messageText}
            </div>
        `;
        inputField.value = '';
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });

        // Typing Indicator
        const typingId = 'typing-' + Date.now();
        chatMessages.innerHTML += `
            <div id="${typingId}" class="bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 self-start max-w-[80%] shadow-sm text-gray-500 italic">
                Mengetik...
            </div>
        `;
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });

        try {
            const response = await fetch('/api/chatbot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ pesan: messageText })
            });

            const data = await response.json();
            const typingElem = document.getElementById(typingId);
            if (typingElem) typingElem.remove();

            if(data.success) {
                chatMessages.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 self-start max-w-[80%] shadow-sm">
                        ${data.balasan}
                    </div>
                `;
            } else {
                chatMessages.innerHTML += `
                    <div class="bg-red-100 text-red-700 border border-red-200 rounded-lg p-3 self-start max-w-[80%] shadow-sm text-xs">
                        Maaf, terjadi kesalahan: ${data.error}
                    </div>
                `;
            }
        } catch (error) {
            const typingElem = document.getElementById(typingId);
            if (typingElem) typingElem.remove();
            chatMessages.innerHTML += `
                <div class="bg-red-100 text-red-700 border border-red-200 rounded-lg p-3 self-start max-w-[80%] shadow-sm text-xs">
                    Gagal terhubung ke server.
                </div>
            `;
        }
        // Final Scroll to Bottom
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    }
</script>
