{% load static %}
<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <a href="/" class="flex items-center gap-2 hover:opacity-80 transition">
                <img src="{% static 'images/LaporYuk.svg' %}" alt="LaporYuk" class="h-10 w-auto" />
                <span class="text-xl font-bold text-gray-950 tracking-tight">LaporYuk!</span>
            </a>

            <div class="hidden md:flex items-center gap-1 bg-gray-50 p-1 rounded-full border border-gray-200/60">
                <a href="/" class="px-5 py-1.5 text-xs font-semibold {% if request.resolver_match.url_name == 'beranda' %}text-emerald-600 bg-white rounded-full shadow-sm{% else %}text-gray-500 rounded-full hover:text-gray-900 transition{% endif %}">Beranda</a>
                <a href="/peta/" class="px-5 py-1.5 text-xs font-semibold {% if request.resolver_match.url_name == 'peta' %}text-emerald-600 bg-white rounded-full shadow-sm{% else %}text-gray-500 rounded-full hover:text-gray-900 transition{% endif %}">Peta</a>
                <a href="/riwayat/" class="px-5 py-1.5 text-xs font-semibold {% if request.resolver_match.url_name == 'riwayat' %}text-emerald-600 bg-white rounded-full shadow-sm{% else %}text-gray-500 rounded-full hover:text-gray-900 transition{% endif %}">Riwayat</a>
                <a href="/profil/" class="px-5 py-1.5 text-xs font-semibold {% if request.resolver_match.url_name == 'profil' %}text-emerald-600 bg-white rounded-full shadow-sm{% else %}text-gray-500 rounded-full hover:text-gray-900 transition{% endif %}">Profil</a>
            </div>

            <div class="flex items-center gap-3">
                <button class="p-2 text-gray-400 hover:text-gray-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </button>
                
                <button class="p-2 text-gray-400 hover:text-gray-600 relative transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full border border-white"></span>
                </button>

                <a href="/lapor/" class="flex items-center gap-2 px-4 py-2 text-xs font-bold text-white bg-emerald-600 rounded-full shadow-lg shadow-emerald-500/20 hover:bg-emerald-700 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>Lapor</span>
                </a>

                <a href="/profil/" class="flex items-center gap-2 pl-2 border-l border-gray-100 hover:opacity-80 transition">
                    {% if current_profile and current_profile.photo %}
                    <img src="{{ current_profile.photo.url }}" alt="Foto Profil" class="w-8 h-8 rounded-full object-cover border border-emerald-100" />
                    {% else %}
                    <div class="w-8 h-8 flex items-center justify-center bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-full text-xs font-bold">
                        {{ request.user.first_name|default:request.user.username|slice:":1" }}{{ request.user.last_name|default:''|slice:":1" }}
                    </div>
                    {% endif %}
                </a>
            </div>
        </div>
    </div>
</nav>
