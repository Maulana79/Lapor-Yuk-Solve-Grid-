{% extends "unfold/layouts/base.html" %}
{% load static %}

{% block extra_css %}
{{ block.super }}
<style>
    .unfold-header-top::after {
        content: '';
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
    }
    
    .back-to-user-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 100;
    }
</style>
{% endblock %}

{% block body %}
{{ block.super }}
<div class="back-to-user-btn">
    <a href="/" class="inline-flex items-center gap-2 px-4 py-2 bg-emerald-600 text-white rounded-lg font-medium text-sm hover:bg-emerald-700 transition shadow-lg">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
        Kembali ke User
    </a>
</div>
{% endblock %}
