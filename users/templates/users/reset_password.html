{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - LaporYuk!</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    
    <style>
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-slide-in {
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-emerald-600 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <div class="w-full max-w-md animate-slide-in">
        <div class="bg-white rounded-2xl shadow-2xl p-4 sm:p-6 border border-slate-100">
            
            <div class="flex flex-col items-center mb-4 sm:mb-6">
                <div class="bg-emerald-100 p-2.5 rounded-2xl text-emerald-600 shadow-inner border border-emerald-200">
                    <svg class="w-4 sm:w-5 h-4 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-lg sm:text-xl font-bold text-gray-950 mt-3 tracking-tight">Reset Password</h1>
                <p class="text-[11px] sm:text-xs text-gray-500 text-center mt-1">Buat password baru yang kuat</p>
            </div>

            {% if messages %}
            <div class="mb-3 sm:mb-4">
                {% for message in messages %}
                <div class="text-[11px] sm:text-xs {% if message.tags %}text-{{ message.tags }}-600 bg-{{ message.tags }}-100 border-{{ message.tags }}-200{% else %}text-green-600 bg-green-100 border-green-200{% endif %} border rounded-lg p-3">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" class="space-y-3 sm:space-y-4 mb-4">
                {% csrf_token %}
                <div>
                    <label class="block text-[11px] sm:text-xs font-semibold text-gray-700 mb-0.5">Password Baru</label>
                    <input type="password" name="new_password" required placeholder="Masukkan password baru" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                    <p class="text-[10px] text-gray-500 mt-1">Minimal 8 karakter, gunakan kombinasi huruf, angka, dan simbol</p>
                </div>

                <div>
                    <label class="block text-[11px] sm:text-xs font-semibold text-gray-700 mb-0.5">Konfirmasi Password</label>
                    <input type="password" name="confirm_password" required placeholder="Konfirmasi password baru" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <button type="submit" class="w-full py-2.5 bg-emerald-600 text-xs text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-700 transition duration-150">
                    Reset Password
                </button>
            </form>

            <div class="text-center text-[11px] sm:text-xs text-gray-500">
                Kembali ke <a href="{% url 'login' %}" class="text-emerald-600 font-bold hover:text-emerald-500 hover:underline">halaman login</a>
            </div>
        </div>
    </div>

</body>
</html>
