{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - LaporYuk!</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    
    <style>
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .animate-img-left {
            animation: slideInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-form-right {
            animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-emerald-600 min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="bg-slate-50 rounded-2xl sm:rounded-3xl shadow-2xl flex flex-col md:flex-row w-full max-w-4xl overflow-hidden p-3 sm:p-5 md:p-6 gap-3 sm:gap-6 items-stretch justify-between max-h-[95vh] md:max-h-none">
        
        <div class="hidden md:flex w-1/2 flex-col items-center justify-center rounded-2xl overflow-hidden animate-img-left">
            <div class="w-full bg-transparent border-0 rounded-2xl flex items-center justify-center flex-1 p-0 overflow-hidden max-h-[440px]">
                <img src="{% static 'images/login-illustration.png' %}" alt="Ilustrasi LaporYuk" class="w-full h-full object-contain p-3">
            </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-center items-center bg-white p-6 sm:p-8 md:p-10 rounded-2xl shadow-sm border border-slate-100 animate-form-right">
            
            <div class="flex flex-col items-center mb-6 text-center">
                <img src="{% static 'images/LaporYuk.svg' %}" alt="LaporYuk logo" class="w-12 sm:w-16 h-auto mb-3">
                <h1 class="text-xl sm:text-2xl font-bold text-gray-950 mt-1 tracking-tight">Selamat Datang di LaporYuk!</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-1">Suaramu, Perubahan Kita</p>
            </div>

            {% if messages %}
            <div class="w-full max-w-xs mx-auto mb-3">
                {% for message in messages %}
                <div class="text-[11px] sm:text-xs text-red-600 bg-red-100 border border-red-200 rounded-lg p-2.5 text-center">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <div class="w-full max-w-xs mx-auto my-4">
                <a href="{% provider_login_url 'google' %}" class="flex items-center justify-center gap-3 w-full py-3 bg-white hover:bg-gray-50 border border-gray-300 rounded-xl shadow-sm font-semibold text-gray-700 text-xs sm:text-sm transition duration-150 transform active:scale-95">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"/>
                    </svg>
                    <span>Masuk dengan Google</span>
                </a>
            </div>
            
            <div class="text-center text-[9px] sm:text-[10px] text-gray-400 mt-6 leading-relaxed max-w-xs mx-auto">
                Dengan masuk, Anda menyetujui <a href="{% url 'syarat_ketentuan' %}" class="underline hover:text-gray-600">Syarat & Ketentuan</a> kami.
            </div>
        </div>
    </div>

</body>
</html>
