{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - LaporYuk!</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <style>
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .animate-form-left {
            animation: slideInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-img-right {
            animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-emerald-600 min-h-screen flex items-center justify-center p-3">

    <div class="bg-slate-50 rounded-3xl shadow-2xl flex flex-col md:flex-row-reverse w-full max-w-4xl overflow-hidden p-5 md:p-6 gap-6 items-stretch justify-between">
        
        <div class="hidden md:flex w-1/2 flex-col items-center justify-center rounded-2xl overflow-hidden animate-img-right">
            <div class="w-full bg-transparent border-0 rounded-2xl flex items-center justify-center flex-1 p-0 overflow-hidden max-h-[440px]">
                <img src="{% static 'images/login-illustration.png' %}" alt="Ilustrasi LaporYuk" class="w-full h-full object-contain p-3">
            </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-center bg-white p-6 md:p-7 rounded-2xl shadow-sm border border-slate-100 animate-form-left">
            <div class="flex flex-col items-center mb-4">
                <div class="bg-emerald-100 p-2.5 rounded-2xl text-emerald-600 shadow-inner border border-emerald-200">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-950 mt-2 tracking-tight">Daftar ke LaporYuk!</h1>
                <p class="text-xs text-gray-500">Mari wujudkan perubahan bersama kami</p>
            </div>

            <div class="flex border border-gray-100 rounded-full p-0.5 w-full max-w-xs bg-gray-50/70 mx-auto mb-4 shadow-inner">
                <button type="button" id="tab-email" onclick="switchTab('email')" class="w-1/2 py-1.5 text-xs font-semibold text-white bg-emerald-600 rounded-full shadow-md transition-all duration-200">Email</button>
                <button type="button" id="tab-nik" onclick="switchTab('nik')" class="w-1/2 py-1.5 text-xs font-semibold text-gray-500 rounded-full hover:text-gray-900">NIK/No. HP</button>
            </div>

            <form id="form-email" class="w-full max-w-xs space-y-3 mx-auto">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Nama Lengkap</label>
                    <input type="text" placeholder="Nama sesuai KTP" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Email</label>
                    <input type="email" placeholder="contoh@email.com" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Password</label>
                    <input type="password" placeholder="Buat password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Konfirmasi Password</label>
                    <input type="password" placeholder="Ulangi password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <button type="submit" class="w-full py-2.5 bg-emerald-600 text-xs text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-700 transition duration-150">
                    Daftar
                </button>
            </form>

            <form id="form-nik" class="w-full max-w-xs space-y-3 mx-auto hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Nama Lengkap</label>
                    <input type="text" placeholder="Nama sesuai KTP" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">NIK atau No. HP</label>
                    <input type="text" placeholder="Masukkan NIK atau No. HP" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Password</label>
                    <input type="password" placeholder="Buat password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Konfirmasi Password</label>
                    <input type="password" placeholder="Ulangi password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <button type="submit" class="w-full py-2.5 bg-emerald-600 text-xs text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-700 transition duration-150">
                    Daftar
                </button>
            </form>

            <div class="text-center my-3 text-gray-400 text-[10px] font-medium">
                <span>atau daftar dengan</span>
            </div>

            <button class="w-full max-w-xs py-2 mx-auto border border-gray-300 rounded-lg flex items-center justify-center gap-2 text-xs font-semibold text-gray-700 bg-white hover:bg-gray-50 active:bg-gray-100 transition shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-4 h-4">
                Daftar dengan Google
            </button>

            <div class="mt-4 text-center text-xs text-gray-500">
               Sudah punya akun? <a href="{% url 'login' %}" class="text-emerald-600 font-bold hover:text-emerald-500 hover:underline">Masuk sekarang</a>
            </div>
            
            <div class="text-center text-[9px] text-gray-400 mt-3 leading-relaxed max-w-xs mx-auto">
                Dengan mendaftar, Anda menyetujui <a href="#" class="underline hover:text-gray-600">Syarat & Ketentuan</a> kami.
            </div>
        </div>
    </div>

    <script>
        function switchTab(type) {
            const tabEmail = document.getElementById('tab-email');
            const tabNik = document.getElementById('tab-nik');
            const formEmail = document.getElementById('form-email');
            const formNik = document.getElementById('form-nik');

            if (type === 'email') {
                tabEmail.className = "w-1/2 py-1.5 text-xs font-semibold text-white bg-emerald-600 rounded-full shadow-md transition-all duration-200";
                tabNik.className = "w-1/2 py-1.5 text-xs font-semibold text-gray-500 rounded-full hover:text-gray-900";
                formEmail.classList.remove('hidden');
                formNik.classList.add('hidden');
            } else {
                tabNik.className = "w-1/2 py-1.5 text-xs font-semibold text-white bg-emerald-600 rounded-full shadow-md transition-all duration-200";
                tabEmail.className = "w-1/2 py-1.5 text-xs font-semibold text-gray-500 rounded-full hover:text-gray-900";
                formNik.classList.remove('hidden');
                formEmail.classList.add('hidden');
            }
        }
    </script>

</body>
</html>
