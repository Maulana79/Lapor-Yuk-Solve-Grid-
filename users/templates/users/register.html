{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - LaporYuk!</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <style>
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes slideInRight {
            0% {
                opacity: 0;
                transform: translateX(50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .animate-form-left {
            animation: slideInLeft 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-img-right {
            animation: slideInRight 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-50 to-emerald-600 min-h-screen flex items-center justify-center p-3">

    <div class="bg-slate-50 rounded-3xl shadow-2xl flex flex-col md:flex-row-reverse w-full max-w-4xl overflow-hidden p-5 md:p-6 gap-6 items-stretch justify-between">
        
        <div class="hidden md:flex w-1/2 flex-col items-center justify-center rounded-2xl overflow-hidden animate-img-right">
            <div class="w-full bg-transparent border-0 rounded-2xl flex items-center justify-center flex-1 p-0 overflow-hidden max-h-[440px]">
                <img src="{% static 'images/login-illustration.png' %}" alt="Ilustrasi LaporYuk" class="w-full h-full object-contain p-3">
            </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-center bg-white p-6 md:p-7 rounded-2xl shadow-sm border border-slate-100 animate-form-left">
            <div class="flex flex-col items-center mb-4">
                <img src="{% static 'images/LaporYuk.svg' %}" alt="LaporYuk logo" class="w-8 sm:w-10 h-auto mb-3">
                <h1 class="text-xl font-bold text-gray-950 mt-1 tracking-tight">Daftar ke LaporYuk!</h1>
                <p class="text-xs text-gray-500">Mari wujudkan perubahan bersama kami</p>
            </div>

            {% if messages %}
            <div class="w-full max-w-xs mx-auto mb-3">
                {% for message in messages %}
                <div class="text-xs text-red-600 bg-red-100 border border-red-200 rounded-lg p-2 mb-2">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'register' %}" class="w-full max-w-xs space-y-3 mx-auto">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Nama Lengkap</label>
                    <input type="text" name="name" required placeholder="Nama sesuai KTP" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">NIK</label>
                    <input type="text" name="nik" required placeholder="Masukkan NIK" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">No. HP</label>
                    <input type="text" name="phone" required placeholder="0812xxxxxxx" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Email</label>
                    <input type="email" name="email" required placeholder="contoh@email.com" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Password</label>
                    <input type="password" name="password" required placeholder="Buat password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-0.5">Konfirmasi Password</label>
                    <input type="password" name="confirm_password" required placeholder="Ulangi password" class="w-full px-3 py-2 text-xs bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-300 focus:border-emerald-500 outline-none transition duration-150">
                </div>

                <button type="submit" class="w-full py-2.5 bg-emerald-600 text-xs text-white font-bold rounded-lg shadow-lg shadow-emerald-500/30 hover:bg-emerald-700 transition duration-150">
                    Daftar
                </button>
            </form>

            <div class="mt-4 text-center text-xs text-gray-500">
               Sudah punya akun? <a href="{% url 'login' %}" class="text-emerald-600 font-bold hover:text-emerald-500 hover:underline">Masuk sekarang</a>
            </div>
            
            <div class="text-center text-[9px] text-gray-400 mt-3 leading-relaxed max-w-xs mx-auto">
                Dengan mendaftar, Anda menyetujui <a href="#" class="underline hover:text-gray-600">Syarat & Ketentuan</a> kami.
            </div>
        </div>
    </div>


</body>
</html>
